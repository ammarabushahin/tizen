name: XAnalytica Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - xanalytica-automation
    paths:
      - 'xanalytica-automation/**'
  schedule:
    # Frequent lightweight checks absorb GitHub scheduler delays.
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: xanalytica-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: xanalytica-automation
          fetch-depth: 0

      - name: Determine refresh slot
        id: slot
        shell: bash
        run: |
          set -euo pipefail

          LAST="$(cat .xanalytica-last-slot 2>/dev/null || true)"

          SLOT="$(LAST_SLOT="$LAST" EVENT_NAME="${{ github.event_name }}" python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Stockholm")
          now = datetime.now(tz)
          targets = (1, 5, 9, 13, 17, 21)
          last_raw = os.environ.get("LAST_SLOT", "").strip()
          event_name = os.environ.get("EVENT_NAME", "")

          def slots_between(start_date, end_date):
              day = start_date
              while day <= end_date:
                  for hour in targets:
                      yield datetime.combine(day, time(hour, 0), tzinfo=tz)
                  day += timedelta(days=1)

          if event_name == "schedule" and last_raw:
              last = datetime.strptime(last_raw, "%Y-%m-%dT%H:%M%z").astimezone(tz)
              due = [slot for slot in slots_between(last.date(), now.date()) if last < slot <= now]
              selected = min(due) if due else last
          else:
              candidates = []
              for delta in (0, -1):
                  day = (now + timedelta(days=delta)).date()
                  for hour in targets:
                      candidate = datetime.combine(day, time(hour, 0), tzinfo=tz)
                      if candidate <= now:
                          candidates.append(candidate)
              selected = max(candidates)

          print(selected.strftime("%Y-%m-%dT%H:%M%z"))
          PY
          )"

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "reason=manual_or_push" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" = "$SLOT" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "reason=slot_already_completed" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "reason=slot_due" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.slot.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.slot.outputs.run == '1'
        working-directory: xanalytica-automation
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run XAnalytica refresh
        if: steps.slot.outputs.run == '1'
        id: refresh
        continue-on-error: true
        working-directory: xanalytica-automation
        env:
          XANALYTICA_EMAIL: ${{ secrets.XANALYTICA_EMAIL }}
          XANALYTICA_PASSWORD: ${{ secrets.XANALYTICA_PASSWORD }}
          FORCE_RUN: '1'
        shell: bash
        run: |
          set -o pipefail
          node refresh.js 2>&1 | tee result.log

      - name: Write run summary
        if: always()
        working-directory: xanalytica-automation
        shell: bash
        run: |
          echo '## XAnalytica Refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Slot: `${{ steps.slot.outputs.slot }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "Decision: `${{ steps.slot.outputs.reason }}`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f result.log ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 result.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.slot.outputs.run }}" = "0" ]; then
            echo 'No refresh was needed; this slot was already completed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No result log was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark successful refresh slot
        if: steps.slot.outputs.run == '1' && steps.refresh.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin xanalytica-automation
          printf '%s\n' "${{ steps.slot.outputs.slot }}" > .xanalytica-last-slot
          git add .xanalytica-last-slot
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark XAnalytica slot ${{ steps.slot.outputs.slot }}"
            git push origin HEAD:xanalytica-automation
          fi

      - name: Mark workflow failed when refresh failed
        if: steps.slot.outputs.run == '1' && steps.refresh.outcome == 'failure'
        run: exit 1
